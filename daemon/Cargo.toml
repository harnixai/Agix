[package]
name = "agixd"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
documentation = "https://docs.rs/agixd"
description  = "agixd — the Agix agent engine as a daemon: sessions served over JSON-RPC 2.0 on a Unix socket, TCP or WebSocket"
readme       = "README.md"
keywords     = ["agent", "llm", "ai", "mcp", "json-rpc"]
categories   = ["command-line-utilities", "development-tools"]
autotests    = false

[lib]
name = "daemon"

[[bin]]
name = "agixd"
path = "src/main.rs"

[dependencies]
settings          = { workspace = true }
platform      = { workspace = true }
runtime       = { workspace = true }
tokio         = { workspace = true, features = ["full"] }
anyhow        = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
lexopt        = "0.3"
serde_json    = { workspace = true }
assembly      = { workspace = true }
# Only for the extension-point docs test, which reads the carrier's bindable points.
script-host   = { workspace = true, optional = true }

[dev-dependencies]
base          = { workspace = true }
scene         = { workspace = true }
tokio-util    = { workspace = true }
telemetry     = { workspace = true }
session-state = { workspace = true, features = ["testing"] }
history       = { workspace = true }
time          = { workspace = true }
model         = { workspace = true, features = ["testing"] }
permissions   = { workspace = true }
hooks         = { workspace = true }
tools         = { workspace = true }
async-trait   = { workspace = true }
futures       = { workspace = true }
url           = { workspace = true }
tokio-tungstenite = { workspace = true }
agents      = { workspace = true }
mcp         = { workspace = true }
skills      = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zip = { workspace = true }
uuid = { workspace = true }
mcp-oauth-mock = { workspace = true }
guards = { workspace = true }
rpc-client = { workspace = true }
schemars = { workspace = true }
assembly = { workspace = true, features = ["rpc-schema"] }

[features]
# The same switches as `assembly`'s, where they are documented; the binary
# only forwards them.
#
# The tiers. The script carrier (`scripts`) and the package layer
# (`plugin-packages`) are chosen separately:
#
#     cargo build -p agixd                                            # full + scripts + packages
#     cargo build -p agixd --no-default-features --features coding,scripts
#     cargo build -p agixd --no-default-features                      # minimal: the kernel
default = ["full", "scripts", "plugin-packages", "sandbox"]
coding = ["mcp", "mcp-oauth-jwt", "agents", "skills", "web", "structured-output", "ptc"]
full = ["coding", "ws"]
mcp = ["assembly/mcp"]
mcp-oauth-jwt = ["assembly/mcp-oauth-jwt"]
agents = ["assembly/agents"]
skills = ["assembly/skills"]
ws = ["assembly/ws"]
web = ["runtime/web"]
structured-output = ["runtime/structured-output"]
# RunCode (docs/ptc.md). Independent of the script carrier, though both run QuickJS.
ptc = ["runtime/ptc"]
scripts = ["assembly/scripts", "dep:script-host"]
plugin-packages = ["assembly/plugin-packages"]
sandbox = ["assembly/sandbox"]
otel = ["assembly/otel"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "mcp_oauth_logs"
path = "tests/mcp_oauth_logs.rs"
