[package]
name = "agix-mcp"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
documentation = "https://docs.rs/agix-mcp"
description  = "Agix — MCP client (server connection, tool adaptation, OAuth authorization)"

[lib]
name = "mcp"

[dependencies]
base          = { workspace = true }
platform      = { workspace = true }
runtime       = { workspace = true }
rmcp          = { workspace = true }
process-wrap  = { workspace = true }
tokio         = { workspace = true, features = ["process", "net"] }
tokio-util    = { workspace = true }
futures       = { workspace = true }
async-trait   = { workspace = true }
reqwest       = { workspace = true, features = ["form"] }
oauth2        = { version = "5", default-features = false }
http          = "1"
serde         = { workspace = true }
serde_json    = { workspace = true }
schemars      = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
url           = { workspace = true }
globset       = { workspace = true }
tokio-tungstenite = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }
uuid          = { workspace = true }
time          = { workspace = true }
libc          = { workspace = true }

[dev-dependencies]
session-state = { workspace = true, features = ["testing"] }
platform = { workspace = true, features = ["testing"] }
settings = { workspace = true }
scene = { workspace = true }
tempfile = { workspace = true }
mcp-oauth-mock = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[features]
# `oauth.private_key_jwt` (RFC 7523 client assertions). rmcp signs them with
# jsonwebtoken, which carries a second crypto backend (aws-lc) into the
# binary; off, a server configured with `private_key_jwt` is refused at
# connect time and nothing of that backend is linked.
mcp-oauth-jwt = ["rmcp/auth-client-credentials-jwt"]

[lints.clippy]
field_reassign_with_default = "allow"
