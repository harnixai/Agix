[package]
name = "agix-model"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
documentation = "https://docs.rs/agix-model"
description  = "Agix — model protocol adapters (Anthropic Messages, OpenAI Chat Completions and Responses), retry and backoff, provider routing"
autotests    = false

[lib]
name = "model"

[dependencies]
base          = { workspace = true }
platform      = { workspace = true }
tokio         = { workspace = true }
tokio-util    = { workspace = true }
futures       = { workspace = true }
async-trait   = { workspace = true }
eventsource-stream = { workspace = true }
async-stream  = { workspace = true }
bytes         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
url           = { workspace = true }
httpdate      = { workspace = true }

[features]
testing = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[[test]]
name = "integration"
path = "tests/integration.rs"
