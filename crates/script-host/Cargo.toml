[package]
name = "agix-script-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agix-script-host"
description = "Agix — the script carrier: operator JavaScript bound to hook points, run in QuickJS with a per-turn quota and budget"

# A host that brings its own `ScriptEngine` can turn the `quickjs` feature off
# and link no interpreter at all.

[lib]
name = "script_host"

[features]
default = ["quickjs"]
quickjs = ["dep:rquickjs", "dep:js-lib"]

[dependencies]
base        = { workspace = true }
runtime     = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
rquickjs    = { workspace = true, optional = true }
js-lib      = { workspace = true, optional = true }

[dev-dependencies]
tokio-util  = { workspace = true }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }

[lints.clippy]
field_reassign_with_default = "allow"
