[package]
name = "agix-skills"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
documentation = "https://docs.rs/agix-skills"
description  = "Agix — the skill catalog and the Skill tool"

[lib]
name = "skills"

[dependencies]
base          = { workspace = true }
settings          = { workspace = true }
prompt-files = { workspace = true }
runtime       = { workspace = true }
permissions   = { workspace = true }
async-trait   = { workspace = true }
regex         = { workspace = true }
serde_json    = { workspace = true }
tracing       = { workspace = true }
notify        = { workspace = true }
globset       = { workspace = true }

[dev-dependencies]
session-state = { workspace = true, features = ["testing"] }
tools         = { workspace = true }
tokio         = { workspace = true }
platform = { workspace = true }
scene      = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }

[lints.clippy]
field_reassign_with_default = "allow"
