# settings 不起进程、不读进程状态：配置从调用方给的目录和 ConfigSource 来。
#
# crate 自己的 clippy.toml 会替换根上那份而不是合并，所以根上的设置在这里重复一遍。
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-types = [
  { path = "std::process::Command", reason = "settings starts no process" },
  # settings builds tokio without `process`, so the path resolves only when
  # another package in the same build turns the feature on.
  { path = "tokio::process::Command", reason = "settings starts no process", allow-invalid = true },
]

disallowed-methods = [
  { path = "std::env::var", reason = "settings reads an environment variable only where #[expect] says why" },
  { path = "std::env::var_os", reason = "settings reads an environment variable only where #[expect] says why" },
  { path = "std::env::vars", reason = "settings reads an environment variable only where #[expect] says why" },
  { path = "std::env::vars_os", reason = "settings reads an environment variable only where #[expect] says why" },
  { path = "std::env::current_dir", reason = "settings never looks at the process cwd: use the session's project root" },
  { path = "std::env::set_var", reason = "process-wide state" },
  { path = "std::env::remove_var", reason = "process-wide state" },
]
