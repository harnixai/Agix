[package]
name = "ptc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Agix — RunCode and RunExt: JavaScript that calls the session's tools, written by the model or brought by a plugin"

[dependencies]
base        = { workspace = true }
js-lib      = { workspace = true }
jsonschema  = { workspace = true }
async-trait = { workspace = true }
rquickjs    = { workspace = true, features = ["futures"] }
schemars    = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
tracing     = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc        = { workspace = true }

[dev-dependencies]
session-state = { workspace = true, features = ["testing"] }
platform = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
field_reassign_with_default = "allow"
