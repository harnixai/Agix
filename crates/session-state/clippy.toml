# session-state starts no process and reads no process state, and where an
# environment variable must be read, `#[expect(clippy::disallowed_methods,
# reason)]` says why.
#
# A crate's clippy.toml replaces the root one rather than merging with it, so
# the root's settings are repeated here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-types = [
  { path = "std::process::Command", reason = "session-state starts no process: build a ProcessSpec and hand it to &dyn Process" },
  # base alone builds tokio without `process`, so the path resolves only when
  # another package in the same build turns the feature on.
  { path = "tokio::process::Command", reason = "session-state starts no process: build a ProcessSpec and hand it to &dyn Process", allow-invalid = true },
]

disallowed-methods = [
  { path = "std::env::var", reason = "session-state reads an environment variable only where #[expect] says why" },
  { path = "std::env::var_os", reason = "session-state reads an environment variable only where #[expect] says why" },
  { path = "std::env::vars", reason = "session-state reads an environment variable only where #[expect] says why" },
  { path = "std::env::vars_os", reason = "session-state reads an environment variable only where #[expect] says why" },
  { path = "std::env::current_dir", reason = "session-state never looks at the process cwd: use the session's project root" },
  { path = "std::env::set_var", reason = "process-wide state" },
  { path = "std::env::remove_var", reason = "process-wide state" },
]
