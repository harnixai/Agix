[package]
name = "agix-compaction"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
documentation = "https://docs.rs/agix-compaction"
description  = "Agix — context compaction (message grouping, cleanup, caching)"

[lib]
name = "compaction"

[dependencies]
base          = { workspace = true }
tokio         = { workspace = true }
tokio-util    = { workspace = true }
async-trait   = { workspace = true }
futures       = { workspace = true }
thiserror     = { workspace = true }

[dev-dependencies]
serde_json    = { workspace = true }
# `test-util` gives paused-clock tests, so the summarization-timeout test runs
# instantly instead of sleeping for real.
tokio = { workspace = true, features = ["test-util"] }
