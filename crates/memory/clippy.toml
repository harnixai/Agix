# memory starts no process and reads no process state.
#
# A crate's clippy.toml replaces the root one rather than merging with it, so
# the root's settings are repeated here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-types = [
  { path = "std::process::Command", reason = "memory starts no process" },
  # the workspace tokio has no `process` feature, so the path resolves only when
  # another package in the same build turns the feature on.
  { path = "tokio::process::Command", reason = "memory starts no process", allow-invalid = true },
]

disallowed-methods = [
  { path = "std::env::var", reason = "memory reads no environment variable" },
  { path = "std::env::var_os", reason = "memory reads no environment variable" },
  { path = "std::env::vars", reason = "memory reads no environment variable" },
  { path = "std::env::vars_os", reason = "memory reads no environment variable" },
  { path = "std::env::current_dir", reason = "memory never looks at the process cwd: use the session's project root" },
  { path = "std::env::set_var", reason = "process-wide state" },
  { path = "std::env::remove_var", reason = "process-wide state" },
]
