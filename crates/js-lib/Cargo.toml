[package]
name = "agix-js-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agix-js-lib"
description = "Agix — the base library every embedded JavaScript runtime gets under the engine's name: YAML, glob, path, JSON Schema, SHA-256, UUID, argument parsing"

[lib]
name = "js_lib"

[dependencies]
base         = { workspace = true }
rquickjs     = { workspace = true }
saphyr-parser = "0.3"
globset      = { workspace = true }
jsonschema   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
uuid         = { workspace = true }

[dev-dependencies]
rquickjs = { workspace = true, features = ["futures"] }
tokio    = { workspace = true, features = ["macros", "rt"] }
